period: Configured period
queries:
  current_sales:
    period: selected
    sql: |
      SELECT SUM(sales_amount) AS sales FROM commercial_sales_daily
  previous_sales:
    period: comparison
    sql: |
      SELECT SUM(sales_amount) AS sales FROM commercial_sales_daily
  sales_trend:
    period: {start: "2024-01-01", end: "2024-04-01"}
    sql: |
      SELECT SUBSTR(CAST(sales_date AS STRING), 1, 7) AS month, ROUND(SUM(sales_amount), 2) AS sales
      FROM commercial_sales_daily GROUP BY 1 ORDER BY 1
  region_sales:
    period: selected
    sql: |
      SELECT region_name AS region, ROUND(SUM(sales_amount), 2) AS sales
      FROM commercial_sales_daily GROUP BY 1 ORDER BY sales DESC LIMIT 6
  top_products:
    period: selected
    sql: |
      SELECT product_name AS product, product_category AS category, ROUND(SUM(sales_amount), 2) AS sales
      FROM commercial_sales_daily GROUP BY 1, 2 ORDER BY sales DESC LIMIT 5
  channel_share:
    period: selected
    sql: |
      SELECT channel_name AS channel, ROUND(SUM(sales_amount), 2) AS sales
      FROM commercial_sales_daily GROUP BY 1 ORDER BY sales DESC
  inventory_health:
    period: selected
    sql: |
      SELECT 100.0 * SUM(CASE WHEN stockout_flag = 0 THEN 1 ELSE 0 END) / COUNT(*) AS healthy_pct
      FROM commercial_inventory_daily
insight:
  headline: Review the active commercial context
  summary: Dashboard metrics reflect the active governed filters and date context shared with Ask AI.
  actions: [Review leading drivers, Validate availability, Track weekly recovery]
