- name: material_fill_rate
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(material_360.service_do_qty) / NULLIF(SUM(material_360.service_po_qty), 0)
  datatype: Decimal
  description: Weighted material Fill Rate by month.
  ai_context:
    synonyms:
    - material fill rate
    - service level material
    - fill rate
  custom_extensions:
  - vendor_name: TEMPO
    data: '{"metric_id":"FL-01-MAT","base_dataset":"material_360","allowed_dimensions":["calmonth","material"],"required_filters":["has_service_level"],"governance_status":"approved_candidate","business_approval_status":"pending_business_confirmation","original_kpi_id":"FL-01"}'
- name: material_sell_out_value
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(material_360.sell_out_bill_val)
  datatype: Decimal
  description: B2B Sell-Out billing value by material and month.
  ai_context:
    synonyms:
    - material sell-out value
    - nilai sell-out sku
  custom_extensions:
  - vendor_name: TEMPO
    data: '{"metric_id":"SO-01-MAT","base_dataset":"material_360","allowed_dimensions":["calmonth","material","retail_plu"],"required_filters":["has_sell_out"],"governance_status":"scoped_metric","business_approval_status":"pending_business_confirmation","original_kpi_id":"SO-01"}'
- name: material_sell_out_to_sell_in_value_ratio
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(material_360.sell_out_bill_val) / NULLIF(SUM(material_360.sell_in_bill_val), 0)
  datatype: Decimal
  description: Material Sell-Out value divided by Sell-In value.
  ai_context:
