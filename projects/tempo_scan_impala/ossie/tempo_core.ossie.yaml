relationships: []
metrics:
- name: gross_billing_value
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(monthly_executive.sales_bill_val)
  datatype: Decimal
  description: Official TEMPO revenue figure, Gross Billing Value from BILL_VAL in IDR.
  ai_context:
    synonyms:
    - gbv
    - gross sale
    - gross sales
    - gross sell
    - gross billing value
    - official revenue
    - bill value
    - pendapatan resmi
    instructions: Use for official company-level revenue with no breakdown, or a monthly trend only. This metric only allows the calmonth dimension - it does NOT support a product/material breakdown. For "top N product/material by sales/revenue" questions, use material_sell_in_value instead. Gold is already IDR; never multiply by 100 again.
  custom_extensions:
  - vendor_name: TEMPO
    data: '{"metric_id":"SI-01","base_dataset":"monthly_executive","allowed_dimensions":["calmonth"],"governance_status":"approved_candidate","business_approval_status":"pending_business_confirmation","original_kpi_id":"SI-01","unit_format":"currency_idr"}'
- name: billing_quantity
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(monthly_executive.sales_bill_qty)
  datatype: Decimal
  description: Total Sell-In billing quantity.
  ai_context:
    synonyms:
    - billing qty
    - billing quantity
    - sell-in qty
    - sell in qty
    - sell-in quantity
    - volume billing
  custom_extensions:
  - vendor_name: TEMPO
    data: '{"metric_id":"SI-02","base_dataset":"monthly_executive","allowed_dimensions":["calmonth"],"governance_status":"approved_candidate","business_approval_status":"pending_business_confirmation","original_kpi_id":"SI-02","unit_format":"quantity"}'
- name: company_fill_rate
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(monthly_executive.svc_do_qty) / NULLIF(SUM(monthly_executive.svc_po_qty), 0)
  datatype: Decimal
  description: Company weighted Fill Rate based on total fulfilled DO quantity divided by total PO quantity.
  ai_context:
    synonyms:
    - company fill rate
    - service level perusahaan
    - tingkat pemenuhan perusahaan
    - fill rate
    instructions: Recompute from total DO and PO; never average monthly ratios.
      When "fill rate" is asked without a material/SKU/office qualifier, this
      is the intended metric (company-wide aggregate).
  custom_extensions:
  - vendor_name: TEMPO
    data: '{"metric_id":"FL-01-EXEC","base_dataset":"monthly_executive","allowed_dimensions":["calmonth"],"governance_status":"approved_candidate","business_approval_status":"pending_business_confirmation","original_kpi_id":"FL-01","unit_format":"percent"}'
- name: do_amount_to_billing_value_ratio
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(monthly_executive.sales_do_amt) / NULLIF(SUM(monthly_executive.sales_bill_val), 0)
  datatype: Decimal
  description: Data-quality alignment ratio between Sales DO amount and Gross Billing Value.
  ai_context:
    synonyms:
    - do to bill ratio
    - rasio do terhadap billing
    instructions: Data-quality metric, not an official revenue KPI.
  custom_extensions:
  - vendor_name: TEMPO
    data: '{"metric_id":"SI-DQ-01","base_dataset":"monthly_executive","allowed_dimensions":["calmonth"],"governance_status":"data_quality_metric","business_approval_status":"internal_technical_review","original_kpi_id":"SI-05","unit_format":"ratio"}'
- name: stock_to_sell_in_quantity_ratio
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(monthly_executive.stock_qty) / NULLIF(SUM(monthly_executive.sales_bill_qty), 0)
  datatype: Decimal
  description: Proxy ratio of warehouse stock snapshot to monthly Sell-In billing quantity.
  ai_context:
    synonyms:
    - stock to sales ratio
    - rasio stok terhadap sell-in
    instructions: Supporting proxy; stock is a snapshot, not inventory flow.
  custom_extensions:
  - vendor_name: TEMPO
    data: '{"metric_id":"ST-SI-01","base_dataset":"monthly_executive","allowed_dimensions":["calmonth"],"governance_status":"supporting","business_approval_status":"pending_business_confirmation","original_kpi_id":"ST-06","unit_format":"ratio"}'
- name: material_sell_in_value
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(material_360.sell_in_bill_val)
  datatype: Decimal
  description: Sell-In Gross Billing Value by material and month.
  ai_context:
    synonyms:
    - material sell-in value
    - revenue material
    - nilai sell-in sku
    - top produk
    - produk terlaris
    - produk paling laku
    - penjualan per produk
    - penjualan produk
    - best selling product
    - top selling product
    - top product
