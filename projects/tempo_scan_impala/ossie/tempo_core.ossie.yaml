version: 0.2.0.dev0
name: tempo_q4_governed
description: Governed TEMPO Q4 2024 semantic model over audited Impala Gold semantic views. Official revenue is Gross Billing
  Value from BILL_VAL.
ai_context:
  instructions: Use only published metrics and dimensions. Gold monetary fields are already normalized to IDR. Never apply
    another 100x scaling. Sell-In and Sell-Out are separate stages and must not be added as one revenue figure. Do not invent
    joins. State Q4-only, shared-customer-only, proxy, data-quality, and pending-business-approval caveats.
  synonyms:
  - TEMPO commercial intelligence
  - Tempo SCAN
  - Sell-In Sell-Out analytics
