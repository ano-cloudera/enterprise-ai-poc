# Local Neo4j for TEMPO business knowledge graph (ontology only — not Impala row data).
# Start: docker compose -f docker-compose.neo4j.yml up -d
# Browser: http://localhost:7474  (user neo4j / see NEO4J_AUTH below)
# Seed:    cd backend && ../.venv/bin/python scripts/seed_neo4j_domain_graph.py

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: tempo-neo4j-local
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/tempo-graph-local
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
    volumes:
      - tempo_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  tempo_neo4j_data:
